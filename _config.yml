# Configuração do GitHub Pages (Jekyll padrão, sem build próprio).
# Publica a branch main, raiz: https://professorjoaomiguel.github.io/lab-boards/
title: Lab Boards
description: >-
  Placas e shields usados em aula (Arduino, ESP32): tensão, pinagem, como
  programar e testes.
lang: pt-BR
author: Prof. Me. Joao Miguel Lac Roehe

# Pastas com ponto não são publicadas por padrão. A .ai/ entra porque o
# README, o AGENTS, o GLOSSARIO e o CONTRIBUTING linkam para ela.
include:
  - .ai

# Só o que não deve virar página. scripts/, inventario/ e templates/ ficam:
# os .py e os .csv são copiados como arquivos, o relatorio.html abre como
# página e o CONTRIBUTING linka o template.
#
# README.md e CONTRIBUTING.md (na raiz) não viram página sozinhos no Jekyll
# do Pages, e um front matter neles apareceria no GitHub. Por isso a home
# (index.html) e o CONTRIBUTING.html incluem o texto desses arquivos pelo
# _includes/markdown-da-raiz.html, que ajusta os links .md para o site.
exclude:
  - .pytest_cache/
  - tests/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "INDEX.md"
    values:
      title: Índice
  - scope:
      path: "IDENTIFICAR.md"
    values:
      title: Que placa é essa?
